services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sipena_db_local
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - mysql

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: sipena_db_local
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: change_this_to_a_long_random_secret
    ports:
      - "4000:4000"
    depends_on:
      - mysql

volumes:
  mysql_data:
