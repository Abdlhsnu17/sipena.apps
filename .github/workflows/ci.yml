name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Environment hygiene
        run: node scripts/check-env-hygiene.mjs

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Install-script check
        run: node scripts/check-install-scripts.mjs

      - name: Backend lint
        run: npm run lint --workspace=inventory-backend

      - name: Backend build
        run: npm run build:backend

      - name: Backend test
        run: npm run test:backend

      - name: Frontend lint
        run: npm run lint --workspace=inventory-frontend

      - name: Frontend type-check
        run: npm run type-check --workspace=inventory-frontend

      - name: Frontend build
        run: npm run build --workspace=inventory-frontend
