name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backend lint
        run: npm run lint --workspace=inventory-backend

      - name: Backend build
        run: npm run build:backend

      - name: Backend tests
        run: npm test --workspace=inventory-backend

      - name: Frontend lint
        run: npm run lint --workspace=inventory-frontend

      - name: Frontend type-check
        run: npm run type-check --workspace=inventory-frontend

      - name: Frontend build
        run: npm run build --workspace=inventory-frontend

      - name: Install Playwright browser
        run: npm run test:e2e:install --workspace=inventory-frontend

      - name: Frontend E2E
        env:
          E2E_NIP: ${{ secrets.E2E_NIP }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npm run test:e2e --workspace=inventory-frontend
