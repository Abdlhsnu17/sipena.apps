name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backend lint
        run: npm run lint --workspace=inventory-backend

      - name: Backend build
        run: npm run build:backend

      - name: Frontend lint
        run: npm run lint --workspace=inventory-frontend

      - name: Frontend type-check
        run: npm run type-check --workspace=inventory-frontend

      - name: Frontend build
        run: npm run build --workspace=inventory-frontend
