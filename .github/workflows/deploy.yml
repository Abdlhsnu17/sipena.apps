name: Deploy SiPeNa

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backend lint
        run: npm run lint --workspace=inventory-backend

      - name: Backend build
        run: npm run build:backend

      - name: Backend tests
        run: npm test --workspace=inventory-backend

      - name: Frontend lint
        run: npm run lint --workspace=inventory-frontend

      - name: Frontend type-check
        run: npm run type-check --workspace=inventory-frontend

      - name: Frontend build
        run: npm run build --workspace=inventory-frontend

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            set -eu

            deploy_path="${DEPLOY_PATH:-/var/www/sipena}"
            repo_url="git@github.com:${{ github.repository }}.git"

            if [ ! -d "$deploy_path/.git" ]; then
              mkdir -p "$deploy_path"

              if [ -n "$(ls -A "$deploy_path")" ]; then
                echo "Deploy path exists but is not a git checkout: $deploy_path" >&2
                exit 1
              fi

              git clone "$repo_url" "$deploy_path"
            fi

            cd "$deploy_path"

            wait_for_healthy() {
              service_name="$1"
              max_attempts="${2:-60}"

              attempt=1
              while [ "$attempt" -le "$max_attempts" ]; do
                health_status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}running{{end}}' "$service_name" 2>/dev/null || true)"

                if [ "$health_status" = "healthy" ] || [ "$health_status" = "running" ]; then
                  return 0
                fi

                sleep 2
                attempt=$((attempt + 1))
              done

              echo "Timed out waiting for $service_name to become healthy." >&2
              docker compose ps >&2
              docker compose logs --no-color --tail=200 "$service_name" >&2 || true
              exit 1
            }

            git fetch origin
            git reset --hard origin/main

            cd packages/backend

            docker compose up -d --force-recreate mysql
            docker compose up -d redis phpmyadmin

            wait_for_healthy backend-mysql-1
            wait_for_healthy backend-redis-1

            docker compose exec -T mysql sh -eu -c '
              escape_sql_string() {
                printf "%s" "$1" | sed "s/'\''/'\'''\''/g"
              }

              escape_sql_identifier() {
                printf "%s" "$1" | sed "s/\`/\`\`/g"
              }

              db_name="${APP_DB_NAME:-sipena_db_local}"
              db_user="${APP_DB_USER:-sipena_app}"
              db_password="${APP_DB_PASSWORD:-changeme}"
              escaped_db_name="$(escape_sql_identifier "$db_name")"
              escaped_db_user="$(escape_sql_string "$db_user")"
              escaped_db_password="$(escape_sql_string "$db_password")"

              if MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP -h127.0.0.1 -uroot <<SQL
            SET SESSION sql_mode = '\''NO_BACKSLASH_ESCAPES'\'';
            CREATE DATABASE IF NOT EXISTS \`$escaped_db_name\`;
            CREATE USER IF NOT EXISTS '\''$escaped_db_user'\''@'\''%'\'' IDENTIFIED BY '\''$escaped_db_password'\'';
            ALTER USER '\''$escaped_db_user'\''@'\''%'\'' IDENTIFIED BY '\''$escaped_db_password'\'';
            GRANT ALL PRIVILEGES ON \`$escaped_db_name\`.* TO '\''$escaped_db_user'\''@'\''%'\'';
            FLUSH PRIVILEGES;
            SQL
              then
                exit 0
              fi

              echo "Root MySQL login failed. Checking whether the configured app database user can connect..." >&2

              if MYSQL_PWD="$db_password" mysql --protocol=TCP -h127.0.0.1 -u"$db_user" "$db_name" -e "SELECT 1" >/dev/null; then
                echo "Root MySQL login failed, but app DB credentials are valid. Continuing deploy without user bootstrap." >&2
                exit 0
              fi

              echo "MySQL credentials are invalid for both root and the app DB user." >&2
              echo "On a reused mysql_data volume, MYSQL_ROOT_PASSWORD must match the password used when that volume was first initialized." >&2
              echo "Fix packages/backend/.env on the VPS, or intentionally recreate the MySQL volume after backing up data." >&2
              exit 1
            '

            mkdir -p backups
            backup_file="backups/pre-migration-$(date +%Y%m%d%H%M%S).sql"
            if docker compose exec -T mysql sh -eu -c '
              db_name="${APP_DB_NAME:-sipena_db_local}"
              db_user="${APP_DB_USER:-sipena_app}"
              db_password="${APP_DB_PASSWORD:-changeme}"
              MYSQL_PWD="$db_password" mysqldump --protocol=TCP -h127.0.0.1 -u"$db_user" --single-transaction --routines --triggers "$db_name"
            ' > "$backup_file"; then
              gzip -f "$backup_file"
              echo "Database backup created: $backup_file.gz"
            else
              rm -f "$backup_file"
              echo "Database backup failed; aborting before migration." >&2
              exit 1
            fi

            if ! docker compose build backend frontend; then
              docker compose ps
              docker compose logs --no-color --tail=200 backend mysql redis
              exit 1
            fi

            if ! docker compose run --rm backend npm run migrate:prod; then
              docker compose ps
              docker compose logs --no-color --tail=200 backend mysql redis
              exit 1
            fi

            if ! docker compose up -d --force-recreate backend frontend; then
              docker compose ps
              docker compose logs --no-color --tail=200 backend mysql redis
              exit 1
            fi

            wait_for_healthy backend-backend-1
            wait_for_healthy backend-frontend-1

            docker ps
