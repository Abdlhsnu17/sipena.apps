name: Deploy VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu

            wait_for_health() {
              service_name="$1"
              attempts=0
              max_attempts=36

              container_id="$(docker compose ps -q "$service_name")"
              if [ -z "$container_id" ]; then
                echo "Container untuk $service_name tidak ditemukan"
                docker compose ps
                exit 1
              fi

              while [ "$attempts" -lt "$max_attempts" ]; do
                health_status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")"

                if [ "$health_status" = "healthy" ]; then
                  echo "$service_name sehat"
                  return 0
                fi

                if [ "$health_status" = "unhealthy" ] || [ "$health_status" = "exited" ] || [ "$health_status" = "dead" ]; then
                  echo "$service_name gagal start dengan status: $health_status"
                  docker compose logs --tail=200 "$service_name"
                  exit 1
                fi

                attempts=$((attempts + 1))
                echo "Menunggu $service_name sehat... percobaan $attempts/$max_attempts (status: $health_status)"
                sleep 5
              done

              echo "Timeout menunggu $service_name sehat"
              docker compose logs --tail=200 "$service_name"
              exit 1
            }

            cd ~/sipena-rsup

            git pull --ff-only origin main

            cd ~/sipena-rsup/packages/backend

            docker compose up -d --build backend frontend

            wait_for_health backend
            wait_for_health frontend

            docker compose ps
