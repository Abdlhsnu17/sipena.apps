name: Deploy SiPeNa

on:
  push:
    branches:
      - main

concurrency:
  group: sipena-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Environment hygiene
        run: node scripts/check-env-hygiene.mjs

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Install-script check
        run: node scripts/check-install-scripts.mjs

      - name: Backend lint
        run: npm run lint --workspace=inventory-backend

      - name: Backend build
        run: npm run build:backend

      - name: Backend test
        run: npm run test:backend

      - name: Frontend lint
        run: npm run lint --workspace=inventory-frontend

      - name: Frontend type-check
        run: npm run type-check --workspace=inventory-frontend

      - name: Frontend build
        run: npm run build --workspace=inventory-frontend

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_ENV: ${{ secrets.DOCKER_ENV }}
          DOCKER_ENV_B64: ${{ secrets.DOCKER_ENV_B64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: DOCKER_ENV,DOCKER_ENV_B64

          script: |
            set -eu

            # GitHub concurrency prevents overlapping workflow runs. This VPS
            # lock also protects against manually re-run/older deploy scripts.
            exec 9>/tmp/sipena-production-deploy.lock
            if ! flock -w 900 9; then
              echo "Another deployment still holds the VPS deploy lock." >&2
              exit 1
            fi

            deploy_path="${DEPLOY_PATH:-/var/www/sipena}"
            repo_url="git@github.com:${{ github.repository }}.git"
            compose_env_file=""

            if [ ! -d "$deploy_path/.git" ]; then
              mkdir -p "$deploy_path"

              if [ -n "$(ls -A "$deploy_path")" ]; then
                echo "Deploy path exists but is not a git checkout: $deploy_path" >&2
                exit 1
              fi

              git clone "$repo_url" "$deploy_path"
            fi

            cd "$deploy_path"

            git remote set-url origin "$repo_url"

            if [ -f docker/.env ]; then
              compose_env_file="docker/.env"
            elif [ -f apps/backend/.docker.env ]; then
              # Backward compatibility for older VPS setups.
              compose_env_file="apps/backend/.docker.env"
            elif [ -n "${DOCKER_ENV_B64:-}" ]; then
              mkdir -p docker
              printf '%s' "$DOCKER_ENV_B64" | base64 -d > docker/.env
              chmod 600 docker/.env
              compose_env_file="docker/.env"
            elif [ -n "${DOCKER_ENV:-}" ]; then
              mkdir -p docker
              printf '%s' "$DOCKER_ENV" > docker/.env
              chmod 600 docker/.env
              compose_env_file="docker/.env"
            fi

            if [ -z "$compose_env_file" ]; then
              echo "Missing Docker Compose env file. Expected docker/.env (preferred), apps/backend/.docker.env, or a GitHub secret named DOCKER_ENV / DOCKER_ENV_B64." >&2
              exit 1
            fi

            compose() {
              if [ -n "$compose_env_file" ]; then
                docker compose --env-file "$compose_env_file" -f docker/compose.yml -p "${COMPOSE_PROJECT_NAME:-sipena}" "$@"
              else
                docker compose -f docker/compose.yml -p "${COMPOSE_PROJECT_NAME:-sipena}" "$@"
              fi
            }

            wait_for_healthy() {
              service_name="$1"
              max_attempts="${2:-90}"

              attempt=1
              while [ "$attempt" -le "$max_attempts" ]; do
                container_id="$(compose ps -q "$service_name" 2>/dev/null || true)"

                if [ -n "$container_id" ]; then
                  health_status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id" 2>/dev/null || true)"

                  if [ "$health_status" = "healthy" ] || [ "$health_status" = "running" ]; then
                    return 0
                  fi

                  if [ "$health_status" = "unhealthy" ] || [ "$health_status" = "exited" ] || [ "$health_status" = "dead" ]; then
                    echo "$service_name entered terminal state: $health_status" >&2
                    docker inspect --format='{{range .State.Health.Log}}{{.End}} exit={{.ExitCode}} {{.Output}}{{println}}{{end}}' "$container_id" >&2 || true
                    compose logs --no-color --tail=200 "$service_name" >&2 || true
                    exit 1
                  fi
                fi

                sleep 2
                attempt=$((attempt + 1))
              done

              echo "Timed out waiting for $service_name to become healthy." >&2
              compose ps >&2
              compose logs --no-color --tail=200 "$service_name" >&2 || true
              exit 1
            }

            free_host_port() {
              port="$1"
              project_dir="$PWD"

              for container_id in $(docker ps -q); do
                owner_dir="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$container_id" 2>/dev/null || true)"

                if [ "$owner_dir" = "$project_dir" ]; then
                  continue
                fi

                if docker port "$container_id" 2>/dev/null | grep -q ":$port\$"; then
                  echo "Removing stray container $container_id holding host port $port (not part of this deploy)." >&2
                  docker rm -f "$container_id" >&2 || true
                fi
              done
            }

            release_mysql_volume() {
              project_name="${COMPOSE_PROJECT_NAME:-sipena}"
              mysql_volume="$(docker volume ls \
                --filter "label=com.docker.compose.project=$project_name" \
                --filter "label=com.docker.compose.volume=mysql_data" \
                --format '{{.Name}}' | head -n 1)"

              if [ -z "$mysql_volume" ]; then
                return 0
              fi

              for container_id in $(docker ps -q --filter "volume=$mysql_volume"); do
                container_name="$(docker inspect --format '{{.Name}}' "$container_id" | sed 's#^/##')"
                echo "Removing stale container $container_name that still holds $mysql_volume." >&2
                docker rm -f "$container_id" >&2
              done
            }

            git fetch origin
            git reset --hard origin/main

            free_host_port "${PHPMYADMIN_HOST_PORT:-8081}"
            free_host_port "${BACKEND_HOST_PORT:-4000}"
            free_host_port "${FRONTEND_HOST_PORT:-3000}"

            # Preserve named volumes, but stop every old project container so
            # only one mysqld process can lock InnoDB's ibdata1 file.
            compose down --remove-orphans
            release_mysql_volume

            # Start independent infrastructure first. Starting phpMyAdmin here
            # would make Compose abort immediately when MySQL is still warming
            # up, before our diagnostics can report the real database error.
            compose up -d mysql redis

            wait_for_healthy mysql
            wait_for_healthy redis

            compose exec -T mysql sh -eu -c '
              escape_sql_string() {
                printf "%s" "$1" | sed "s/'\''/'\'''\''/g"
              }

              escape_sql_identifier() {
                printf "%s" "$1" | sed "s/\`/\`\`/g"
              }

              db_name="${DB_NAME:-${APP_DB_NAME:-${MYSQL_DATABASE:-sipena_db_local}}}"
              db_user="${DB_USER:-${APP_DB_USER:-${MYSQL_USER:-sipena_app}}}"
              db_password="${DB_PASSWORD:-${APP_DB_PASSWORD:-${MYSQL_PASSWORD:-changeme}}}"
              escaped_db_name="$(escape_sql_identifier "$db_name")"
              escaped_db_user="$(escape_sql_string "$db_user")"
              escaped_db_password="$(escape_sql_string "$db_password")"

              if MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP -h127.0.0.1 -uroot <<SQL
            SET SESSION sql_mode = '\''NO_BACKSLASH_ESCAPES'\'';
            CREATE DATABASE IF NOT EXISTS \`$escaped_db_name\`;
            CREATE USER IF NOT EXISTS '\''$escaped_db_user'\''@'\''%'\'' IDENTIFIED BY '\''$escaped_db_password'\'';
            ALTER USER '\''$escaped_db_user'\''@'\''%'\'' IDENTIFIED BY '\''$escaped_db_password'\'';
            GRANT ALL PRIVILEGES ON \`$escaped_db_name\`.* TO '\''$escaped_db_user'\''@'\''%'\'';
            FLUSH PRIVILEGES;
            SQL
              then
                exit 0
              fi

              echo "Root MySQL login failed. Checking whether the configured app database user can connect..." >&2

              if MYSQL_PWD="$db_password" mysql --protocol=TCP -h127.0.0.1 -u"$db_user" "$db_name" -e "SELECT 1" >/dev/null; then
                echo "Root MySQL login failed, but app DB credentials are valid. Continuing deploy without user bootstrap." >&2
                exit 0
              fi

              echo "MySQL credentials are invalid for both root and the app DB user." >&2
              echo "On a reused mysql_data volume, MYSQL_ROOT_PASSWORD must match the password used when that volume was first initialized." >&2
              echo "Fix docker/.env on the VPS, or intentionally recreate the MySQL volume after backing up data." >&2
              exit 1
            '

            compose up -d phpmyadmin

            mkdir -p backups
            backup_file="backups/pre-migration-$(date +%Y%m%d%H%M%S).sql"
            if compose exec -T mysql sh -eu -c '
              db_name="${DB_NAME:-${APP_DB_NAME:-${MYSQL_DATABASE:-sipena_db_local}}}"
              db_user="${DB_USER:-${APP_DB_USER:-${MYSQL_USER:-sipena_app}}}"
              db_password="${DB_PASSWORD:-${APP_DB_PASSWORD:-${MYSQL_PASSWORD:-changeme}}}"
              MYSQL_PWD="$db_password" mysqldump --protocol=TCP -h127.0.0.1 -u"$db_user" --single-transaction --routines --triggers --no-tablespaces "$db_name"
            ' > "$backup_file"; then
              gzip -f "$backup_file"
              echo "Database backup created: $backup_file.gz"
            else
              rm -f "$backup_file"
              echo "Database backup failed; aborting before migration." >&2
              exit 1
            fi

            if ! compose build backend frontend; then
              compose ps
              compose logs --no-color --tail=200 backend mysql redis
              exit 1
            fi

            if ! compose run --rm backend npm run migrate:prod; then
              compose ps
              compose logs --no-color --tail=200 backend mysql redis
              exit 1
            fi

            if ! compose up -d --force-recreate backend frontend; then
              compose ps
              compose logs --no-color --tail=200 backend mysql redis
              exit 1
            fi

            wait_for_healthy backend
            wait_for_healthy frontend

            docker ps
